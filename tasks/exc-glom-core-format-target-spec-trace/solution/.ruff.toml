# Generated by okfpipe (stage 1).
#
# ruff is used for both linting and formatting so there is exactly one
# tool, one config and one version pinned in requirements.lock.

extend = "ruff.toml"  # the repo already had ruff config; it still wins

line-length = 100
target-version = "py311"

extend-exclude = [
    "build",
    "dist",
    "docs",
    ".tox",
    ".nox",
    "*.egg-info",
    "vendor",
    "third_party",
    "_vendor",
]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]

ignore = [
    "E501",  # line length is the formatter's job, not the linter's
    "E203",  # conflicts with the formatter's slice spacing
    "B008",  # function call in argument default is a deliberate idiom in many APIs
    "RUF012",  # mutable class attrs without ClassVar are pervasive in untyped code
]

[lint.per-file-ignores]
# Tests legitimately shadow names, assert on unused values and import lazily.
"**/test_*.py" = ["F401", "F811", "F841", "B011", "E731"]
"**/tests/**" = ["F401", "F811", "F841", "B011", "E731"]
"**/conftest.py" = ["F401", "F811"]
"__init__.py" = ["F401", "F403"]  # re-exports are the whole point

[format]
quote-style = "preserve"      # do not churn every string literal
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = false  # never rewrite doctest bodies
